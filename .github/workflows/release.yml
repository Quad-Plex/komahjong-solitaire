name: Release plugin

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          major=1
          minor=-1

          # A major-only tag, such as v2, starts a new release series at v2.0.
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+)$ ]]; then
              tag_major=${BASH_REMATCH[1]}
              tag_minor=-1
            elif [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
              tag_major=${BASH_REMATCH[1]}
              tag_minor=${BASH_REMATCH[2]}
            else
              continue
            fi

            if (( tag_major > major )); then
              major=$tag_major
              minor=$tag_minor
            elif (( tag_major == major && tag_minor > minor )); then
              minor=$tag_minor
            fi
          done < <(git tag --list 'v*')

          next_minor=$((minor + 1))
          if (( minor < 0 )); then
            next_minor=0
          fi

          version="${major}.${next_minor}"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        shell: bash
        run: |
          test -f mahjong.koplugin/_meta.lua
          zip -r "mahjong.koplugin-v${{ steps.version.outputs.version }}.zip" mahjong.koplugin

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          ZIP_FILE: mahjong.koplugin-v${{ steps.version.outputs.version }}.zip
        run: |
          {
            printf 'Automated release for commit %s.\n\n' "$COMMIT_SHA"
            git log -1 --format='%B' "$COMMIT_SHA"
            printf '\n\n## Installation\n\n'
            printf '1. Download the `%s` asset from this release.\n' "$ZIP_FILE"
            printf '%s\n' '2. Extract the ZIP file directly into KOReader'\''s `plugins/` directory. The archive already contains the complete `mahjong.koplugin/` folder, so it should create `plugins/mahjong.koplugin/`.'
            printf '3. Do not copy only the Lua files; keep the entire plugin folder and its `icons/` directory intact.\n'
            printf '4. Fully restart KOReader, because plugins are loaded during startup.\n'
            printf '5. Open **Tools -> Mahjong Solitaire** from the KOReader menu.\n'
          } > release-notes.md

          gh release create "$RELEASE_TAG" "$ZIP_FILE" \
            --target "$COMMIT_SHA" \
            --title "KoMahjong Solitaire v${RELEASE_VERSION}" \
            --notes-file release-notes.md
